# Arffornia server-list MOTD (the two lines under the server name in Multiplayer).
#
# Source of truth: Arffornia_Provisioning config/proxy/storage/plugins/arffornia_proxy/motd.yml.
# Edit it there with a PR; the proxy picks it up at its next start, and also reloads it
# live whenever the file on disk changes. Preview any day in game or in the console:
#   /motdpreview 2026-12-25 fr
#
# Text format: MiniMessage, https://docs.advntr.dev/minimessage/format.html
# Keep each line short (about 45 characters), the server list is narrow.
#
# Languages: the server-list ping does not say which language the player uses. The proxy
# remembers, in memory only, the language of players who joined recently from the same
# address; everyone else sees `default-language`.
#
# How an entry is chosen on a given day:
#   1. keep the entries whose `dates` match today (no `dates` = every day);
#   2. keep only the highest `priority` (dated entries default to 10, others to 0),
#      so seasonal entries replace the everyday quotes;
#   3. draw one at random, by `weight` (default 1).
#
# `dates` forms (bounds included, times in `timezone`):
#   "12-25"                    that day, every year
#   "10-24..10-31"             that range, every year ("12-31..01-02" wraps the new year)
#   "2027-04-03"               that exact day only
#   "2026-12-01..2027-01-15"   that exact range only

settings:
  default-language: en
  languages: [en, fr]
  timezone: Europe/Paris
  remember-player-language: true
  # First line, shown above every entry unless the entry sets its own `header`.
  header: "<bold><gradient:#09add3:#7ee8fa>Arffornia</gradient></bold> <dark_gray>»</dark_gray> <gray>modded survival 1.21.1</gray>"

entries:
  # ---------------------------------------------------------------- everyday quotes
  - id: creeper-feelings
    en: "<green>Creepers have feelings. Explosive ones."
    fr: "<green>Les creepers ont du cœur. Explosif."
  - id: one-table
    en: "<gold>330 mods, one crafting table."
    fr: "<gold>330 mods, une seule table de craft."
  - id: factory-size
    en: "<aqua>Your factory is not big enough. Yet."
    fr: "<aqua>Ton usine est trop petite. Pour l'instant."
  - id: automation
    en: "<white>Diamonds fade. Automation is forever."
    fr: "<white>Les diamants passent. Les usines restent."
  - id: dig-down
    en: "<yellow>Do not dig straight down. Seriously."
    fr: "<yellow>Ne creuse pas tout droit. Sérieusement."
  - id: chunk-coffee
    en: "<gray>Chunks loaded. Coffee loaded. Let's go."
    fr: "<gray>Chunks chargés, café chargé. C'est parti."
  - id: vote
    en: "<light_purple>Vote every day, the shop remembers."
    fr: "<light_purple>Vote chaque jour, la boutique s'en souvient."

  # ---------------------------------------------------------------- yearly events
  - id: new-year
    dates: "12-31..01-02"
    header: "<bold><gradient:#ffd700:#ff8c00>Arffornia</gradient></bold> <yellow>✦</yellow> <gold>Happy New Year!</gold>"
    en: "<yellow>May your TPS stay at 20 all year."
    fr: "<yellow>Bonne année ! Que tes TPS restent à 20."
  - id: valentine
    dates: "02-14"
    en: "<red>Roses are red, and so is redstone."
    fr: "<red>Les roses sont rouges, la redstone aussi."
  - id: april-fools
    dates: "04-01"
    header: "<bold><rainbow>Arffornia</rainbow></bold> <dark_gray>»</dark_gray> <gray>now in 2D</gray>"
    en: "<white>Minecraft 2 is out! <dark_gray>(No.)"
    fr: "<white>Minecraft 2 est sorti ! <dark_gray>(Non.)"
  - id: anniversary
    # Placeholder: the Arffornia_Website repository was created on 2024-04-03.
    # Replace with the real opening date of the server.
    dates: "04-03"
    header: "<bold><gradient:#09add3:#f59e0b>Arffornia</gradient></bold> <gold>★</gold> <yellow>happy birthday!</yellow>"
    en: "<yellow>One more year of builds. Thanks for playing!"
    fr: "<yellow>Encore une année de builds. Merci de jouer !"
  - id: fete-de-la-musique
    dates: "06-21"
    en: "<aqua>Music day: note blocks everywhere!"
    fr: "<aqua>Fête de la musique : note blocks partout !"
  - id: bastille-day
    dates: "07-14"
    en: "<blue>Fireworks</blue> <white>crafted,</white> <red>sky ready."
    fr: "<blue>14 juillet :</blue> <white>à vos</white> <red>feux d'artifice !"
  - id: halloween-mining
    dates: "10-24..10-31"
    header: "<bold><gradient:#ff7a00:#7b2cbf>Arffornia</gradient></bold> <dark_gray>»</dark_gray> <gold>☠ spooky season</gold>"
    en: "<gray>Something is mining right behind you..."
    fr: "<gray>Quelque chose creuse juste derrière toi..."
  - id: halloween-wither
    dates: "10-24..10-31"
    header: "<bold><gradient:#ff7a00:#7b2cbf>Arffornia</gradient></bold> <dark_gray>»</dark_gray> <gold>☠ spooky season</gold>"
    en: "<dark_purple>Trick or treat? The Wither chose trick."
    fr: "<dark_purple>Un bonbon ou un sort ? Le Wither a choisi."
  - id: christmas-golems
    dates: "12-20..12-26"
    header: "<bold><gradient:#e63946:#2a9d8f>Arffornia</gradient></bold> <dark_gray>»</dark_gray> <white>❄ Merry Christmas</white>"
    en: "<white>Snow golems are on duty. Stay warm!"
    fr: "<white>Les golems de neige sont de service !"
  - id: christmas-hoppers
    dates: "12-20..12-26"
    header: "<bold><gradient:#e63946:#2a9d8f>Arffornia</gradient></bold> <dark_gray>»</dark_gray> <white>❄ Joyeux Noël</white>"
    en: "<green>Santa switched to hoppers this year."
    fr: "<green>Le père Noël est passé aux entonnoirs."

  # ---------------------------------------------------------------- one-off dates
  # An exact date wins over the yearly entries above when you give it a higher priority.
  # - id: season-2-launch
  #   dates: "2027-01-09..2027-01-11"
  #   priority: 20
  #   en: "<gold>Season 2 is live! Fresh world, new machines."
  #   fr: "<gold>La saison 2 est lancée ! Nouveau monde, nouvelles machines."
