# Configuration for the Arffornia Proxy Plugin.
# The plugin stays disabled until all three values below are set.
# In production this file is provided by Arffornia_Provisioning; never commit real values.

# Base URL of the Arffornia website API, e.g. https://arffornia.com/api
api.base-url=

# Website service-account credentials (role: nuvotifier_service)
api.client-id=
api.client-secret=
