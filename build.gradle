plugins {
    id 'java'
    id 'eclipse'
    id 'org.jetbrains.gradle.plugin.idea-ext' version '1.1.8'
    id("xyz.jpenilla.run-velocity") version "2.3.1"
    id 'com.github.breadmoirai.github-release' version '2.4.1'
}

group = 'fr.thegostsniper'
version = project.hasProperty('pluginVersion') ? project.pluginVersion : '1.0-SNAPSHOT'

repositories {
    mavenCentral()
    maven {
        name = "papermc-repo"
        url = "https://repo.papermc.io/repository/maven-public/"
    }
    maven { url 'https://jitpack.io' }
}

dependencies {
    compileOnly("com.velocitypowered:velocity-api:3.4.0-SNAPSHOT")
    annotationProcessor("com.velocitypowered:velocity-api:3.4.0-SNAPSHOT")
    compileOnly('com.github.parallelblock:NuVotifier:2.7.3')

    compileOnly('com.google.code.gson:gson:2.10.1')

    testImplementation("com.velocitypowered:velocity-api:3.4.0-SNAPSHOT")
    testImplementation('com.github.parallelblock:NuVotifier:2.7.3')
    testImplementation('com.google.code.gson:gson:2.10.1')
    testImplementation(platform('org.junit:junit-bom:5.11.4'))
    testImplementation('org.junit.jupiter:junit-jupiter')
    testRuntimeOnly('org.junit.platform:junit-platform-launcher')
}

tasks.named('test', Test) {
    useJUnitPlatform()
}

githubRelease {
    def githubToken = System.getenv("GITHUB_TOKEN")
    if (githubToken) {
        token = githubToken
    }
    def repoOwner = System.getenv("GITHUB_REPOSITORY_OWNER")
    if (repoOwner) {
        owner = repoOwner
    }
    repo = 'Arffornia_Proxy'
    tagName = "v${project.version}"
    releaseName = "Release ${project.version}"

    releaseAssets.from(tasks.jar.outputs.files)
}

tasks {
    runVelocity {
        velocityVersion("3.4.0-SNAPSHOT")
    }
}

def targetJavaVersion = 17
java {
    toolchain.languageVersion = JavaLanguageVersion.of(targetJavaVersion)
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release.set(targetJavaVersion)
}

tasks.named('jar', Jar) {
    archiveFileName.set("arffornia_proxy.jar")
}

def templateSource = file('src/main/templates')
def templateDest = layout.buildDirectory.dir('generated/sources/templates')
def generateTemplates = tasks.register('generateTemplates', Copy) { task ->
    def props = ['version': project.version]
    task.inputs.properties props

    task.from templateSource
    task.into templateDest
    task.expand props
}

sourceSets.main.java.srcDir(generateTemplates.map { it.outputs })

project.idea.project.settings.taskTriggers.afterSync generateTemplates
project.eclipse.synchronizationTasks(generateTemplates)